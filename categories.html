<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - TRS Admin</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div id="overlay" class="sidebar-overlay"></div>

<div class="sidebar">

<h2>TRS Admin</h2>

<ul>

<li onclick="location.href='admin.html'">🏠 Dashboard</li>

<li onclick="location.href='products.html'">📦 Products</li>

<li class="active">📂 Categories</li>

<li onclick="location.href='banners.html'">🎞️ Banners</li>

<li onclick="location.href='orders.html'">🛒 Orders</li>

<li onclick="location.href='resellers.html'">👥 Resellers</li>

<li onclick="location.href='settings.html'">⚙️ Settings</li>

</ul>

</div>

<header class="admin-header">

<button id="menuBtn">☰</button>

<div style="display:flex;justify-content:space-between;align-items:center;width:100%;">

<h2>Categories</h2>

<button id="logoutBtn">Logout</button>

</div>

</header>

<div class="admin-container">

<h2>Category Management</h2>

<input
type="text"
id="categoryName"
placeholder="Category Name">

<input
type="file"
id="categoryImage"
accept="image/*">

<input
type="number"
id="categoryOrder"
placeholder="Display Order">

<label style="display:flex;align-items:center;gap:10px;margin:15px 0;">

<input
type="checkbox"
id="showHomepage"
checked>

Show On Homepage

</label>

<input type="hidden" id="editingCategoryId">

<button id="saveCategory">

Save Category

</button>

<hr style="margin:25px 0;">

<h3>Category List</h3>

<div id="categoryList"></div>

</div>

<script type="module" src="categories.js"></script>

<script>

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.querySelector(".sidebar");
const overlay = document.getElementById("overlay");

menuBtn.onclick = function () {
    sidebar.classList.toggle("show");
    overlay.classList.toggle("show");
};

overlay.onclick = function () {
    sidebar.classList.remove("show");
    overlay.classList.remove("show");
};

</script>

</body>

</html>
