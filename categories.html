<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - TRS Admin</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div id="overlay" class="sidebar-overlay"></div>

<!-- Sidebar -->

<div class="sidebar">

<h2>TRS Admin</h2>

<ul>

<li onclick="location.href='admin.html'">
<i class="fas fa-house"></i>
<span>Dashboard</span>
</li>

<li onclick="location.href='products.html'">
<i class="fas fa-box"></i>
<span>Products</span>
</li>

<li class="active">
<i class="fas fa-layer-group"></i>
<span>Categories</span>
</li>

<li onclick="location.href='banners.html'">
<i class="fas fa-images"></i>
<span>Banners</span>
</li>

<li onclick="location.href='orders.html'">
<i class="fas fa-cart-shopping"></i>
<span>Orders</span>
</li>

<li onclick="location.href='resellers.html'">
<i class="fas fa-users"></i>
<span>Resellers</span>
</li>

<li onclick="location.href='settings.html'">
<i class="fas fa-gear"></i>
<span>Settings</span>
</li>

</ul>

</div>


<!-- Mobile Header -->

<header class="admin-header">

<button id="menuBtn">
<i class="fas fa-bars"></i>
</button>

<div class="category-header-title">

<h2>Categories</h2>

<button id="logoutBtn">
<i class="fas fa-right-from-bracket"></i>
</button>

</div>

</header>


<!-- Main -->

<div class="admin-container category-page">

<div class="category-top">

<div>

<h2>Category Management</h2>

<p>Manage your product categories</p>

</div>

</div>


<!-- Add / Edit Category -->

<div class="category-form-card">

<div class="category-form-title">

<h3>
<i class="fas fa-layer-group"></i>
Add / Edit Category
</h3>

<button type="button" id="toggleCategoryForm">
<i class="fas fa-chevron-up"></i>
</button>

</div>


<div id="categoryFormContent">

<label>Category Name</label>

<input
type="text"
id="categoryName"
placeholder="Enter category name">


<label>Category Image</label>

<input
type="file"
id="categoryImage"
accept="image/*">


<label>Display Order</label>

<input
type="number"
id="categoryOrder"
placeholder="Display order">


<label class="homepage-check">

<input
type="checkbox"
id="showHomepage"
checked>

<span>Show On Homepage</span>

</label>


<input
type="hidden"
id="editingCategoryId">


<button
id="saveCategory"
class="category-save-btn">

<i class="fas fa-save"></i>

<span>Save Category</span>

</button>

</div>

</div>


<!-- Category List -->

<div class="category-list-card">

<div class="category-list-header">

<div>

<h3>Categories</h3>

<p id="categoryTotal">Loading categories...</p>

</div>

</div>


<div id="categoryList">

<div class="category-loading">

<i class="fas fa-spinner fa-spin"></i>

Loading categories...

</div>

</div>

</div>

</div>


<script type="module" src="categories.js"></script>


<script>

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.querySelector(".sidebar");

const overlay =
document.getElementById("overlay");


menuBtn.onclick = function(){

sidebar.classList.toggle("show");

overlay.classList.toggle("show");

};


overlay.onclick = function(){

sidebar.classList.remove("show");

overlay.classList.remove("show");

};


/* Form Toggle */

const toggleBtn =
document.getElementById("toggleCategoryForm");

const formContent =
document.getElementById("categoryFormContent");


toggleBtn.onclick = function(){

formContent.classList.toggle("hide");

toggleBtn.classList.toggle("rotate");

};


/* Logout */

document
.getElementById("logoutBtn")
.addEventListener("click", function(){

if(confirm("Are you sure you want to logout?")){

localStorage.removeItem("adminLoggedIn");

window.location.href="admin-login.html";

}

});

</script>

</body>

</html>
