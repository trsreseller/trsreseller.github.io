<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products - TRS Admin</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div id="overlay" class="sidebar-overlay"></div>

<div class="sidebar">

<h2>TRS Admin</h2>

<ul>

<li onclick="location.href='admin.html'">🏠 Dashboard</li>

<li class="active">📦 Products</li>

<li>📂 Categories</li>

<li>🎞️ Banners</li>

<li>🛒 Orders</li>

<li>👥 Resellers</li>

<li>⚙️ Settings</li>

</ul>

</div>

<header class="admin-header">

<button id="menuBtn">☰</button>

<div style="display:flex;justify-content:space-between;align-items:center;width:100%;">

<h2>Products</h2>

<button id="logoutBtn">Logout</button>

</div>

</header>

<div class="admin-container">

<h2>Products Management</h2>

<input type="file" id="productImages" multiple accept="image/*">

<input type="text" id="productName" placeholder="Product Name">

<input type="text" id="sku" placeholder="SKU">

<textarea id="productDescription" placeholder="Description"></textarea>

<select id="productCategory">
<option value="">Select Category</option>
</select>

<input type="number" id="buyingPrice" placeholder="Buying Price">

<input type="number" id="oldPrice" placeholder="Regular / Old Price">

<input type="number" id="sellPrice" placeholder="Sell / Current Price">

<input type="number" id="suggestedPrice" placeholder="Suggested Selling Price">

<input type="text" id="variants" placeholder="Product Variants">

<div class="rating-box">

<label>Product Rating</label>

<div id="ratingStars">

<span class="star" data-rating="1">★</span>

<span class="star" data-rating="2">★</span>

<span class="star" data-rating="3">★</span>

<span class="star" data-rating="4">★</span>

<span class="star" data-rating="5">★</span>

</div>

<input type="hidden" id="rating" value="0">

</div>

<textarea id="note" placeholder="Note"></textarea>

<select id="productStatus">

<option value="Active">Active</option>

<option value="Draft">Draft</option>

<option value="Out Of Stock">Out Of Stock</option>

</select>

<input type="hidden" id="editingId">

<input type="number" id="productStock" placeholder="Stock">

<button id="saveProduct">

Add Product

</button>

<hr style="margin:25px 0;">

<h3>Product List</h3>

<div id="productList"></div>

</div>

<script type="module" src="products.js"></script>

<script>

const menuBtn=document.getElementById("menuBtn");

const sidebar=document.querySelector(".sidebar");

const overlay=document.getElementById("overlay");

menuBtn.onclick=()=>{

sidebar.classList.toggle("show");

overlay.classList.toggle("show");

};

overlay.onclick=()=>{

sidebar.classList.remove("show");

overlay.classList.remove("show");

};

</script>

</body>

</html>
