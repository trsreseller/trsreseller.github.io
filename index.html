<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRS Reseller</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
TRS <span>Reseller</span>
</div>

<div class="menu">
<button
class="cart-header-btn"
onclick="window.location.href='cart.html'">

<i class="fas fa-cart-shopping"></i>

<span id="cartCountBadge">
0
</span>

</button>
<button class="login" id="loginBtn">
Login
</button>
</div>

</header>

<section class="search-box">

<input type="text" id="searchInput" placeholder="Search Products...">

<button>
<i class="fas fa-search"></i>
</button>

</section>

<!-- Banner Slider -->

<section class="banner-slider">

<div class="slider">

</div>

</section>

<!-- Categories -->

<section class="categories">

<h2>Categories</h2>

<div id="categoryGrid" class="category-grid">

</div>

</section>

<!-- Featured Products -->

<section class="products">

<div id="homepageProducts">

</div>

</section>

<!-- Order Popup -->

<div id="orderPopup" class="order-popup" style="display:none;">

<div class="popup-box">

<h2 id="popupProductName"></h2>

<p>
Wholesale Price :
<b id="popupWholesale"></b>
</p>

<input
type="number"
id="sellingPrice"
placeholder="Enter Selling Price">

<p>

Profit :

<b id="popupProfit">

৳0

</b>

</p>

<input
type="number"
id="qty"
value="1"
min="1">

<button id="addCartBtn">

Add To Cart

</button>

<button id="closePopup">

Close

</button>

</div>

</div>

<script type="module" src="main.js"></script>

<div class="product-modal" id="productModal">

<div class="modal-content">

<span class="close-modal">&times;</span>

<img src="assets/product1.jpg" alt="Product">

<h2>Premium T-Shirt</h2>

<p>Selling Price: <b>৳850</b></p>

<p>Reseller Profit: <b style="color:green;">৳150</b></p>

<p>
High quality premium cotton T-shirt.
</p>

<button class="buy-btn">
Add to Cart
</button>

</div>

</div>

<!-- Bottom Navigation -->

<nav class="bottom-nav">

<button class="nav-item active"
onclick="window.location.href='index.html'">

<i class="fas fa-house"></i>

<span>Home</span>

</button>

<button class="nav-item"
onclick="window.location.href='category.html'">
<i class="fas fa-layer-group"></i>
<span>Category</span>
</button>

<button class="nav-item"
onclick="window.location.href='cart.html'">
<i class="fas fa-cart-shopping"></i>
<span>Cart</span>
</button>

<button class="nav-item"
onclick="window.location.href='account.html'">
<i class="fas fa-user"></i>
<span>Account</span>
</button>

</nav>
</body>
</html>
