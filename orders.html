<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TRS Admin - Orders</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="orders.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="admin-header">

    <button
        class="back-btn"
        onclick="history.back()"
    >
        <i class="fas fa-arrow-left"></i>
    </button>

    <div>

        <h2>
            Order Management
        </h2>

        <p>
            Manage reseller orders
        </p>

    </div>

</header>


<!-- =========================
     TOOLBAR
========================= -->

<section class="orders-toolbar">


    <!-- Search -->

    <div class="search-box">

        <i class="fas fa-search"></i>

        <input
            type="text"
            id="orderSearch"
            placeholder="Search customer, phone or Order ID..."
        >

    </div>


    <!-- Status -->

    <div class="filter-box">

        <i class="fas fa-filter"></i>

        <select id="statusFilter">

            <option value="All">
                All Orders
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Processing">
                Processing
            </option>

            <option value="Confirmed">
                Confirmed
            </option>

            <option value="Shipped">
                Shipped
            </option>

            <option value="Delivered">
                Delivered
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

            <option value="Returned">
                Returned
            </option>

        </select>

    </div>


    <!-- Refresh -->

    <button
        id="refreshOrders"
        class="refresh-btn"
        title="Refresh Orders"
    >

        <i class="fas fa-rotate"></i>

    </button>


</section>


<!-- =========================
     ORDER SUMMARY
========================= -->

<section class="order-summary">


    <div class="summary-card">

        <div class="summary-icon pending">
            <i class="fas fa-clock"></i>
        </div>

        <div>

            <strong id="pendingCount">
                0
            </strong>

            <span>
                Pending
            </span>

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-icon processing">
            <i class="fas fa-spinner"></i>
        </div>

        <div>

            <strong id="processingCount">
                0
            </strong>

            <span>
                Processing
            </span>

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-icon delivered">
            <i class="fas fa-circle-check"></i>
        </div>

        <div>

            <strong id="deliveredCount">
                0
            </strong>

            <span>
                Delivered
            </span>

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-icon total">
            <i class="fas fa-cart-shopping"></i>
        </div>

        <div>

            <strong id="totalOrderCount">
                0
            </strong>

            <span>
                Total Orders
            </span>

        </div>

    </div>


</section>


<!-- =========================
     ORDERS
========================= -->

<main id="orderList">

    <div class="loading-box">

        <i class="fas fa-spinner fa-spin"></i>

        Loading orders...

    </div>

</main>


<!-- =========================
     ORDER DETAILS MODAL
========================= -->

<div
    id="orderModal"
    class="order-modal"
>

    <div class="order-modal-content">


        <div class="modal-header">

            <div>

                <h2>
                    Order Details
                </h2>

                <p id="modalOrderInternal">
                    Order
                </p>

            </div>


            <button
                id="closeModal"
                class="close-modal"
            >

                <i class="fas fa-xmark"></i>

            </button>

        </div>


        <div id="orderDetailsContent">

        </div>


    </div>

</div>


<script
    type="module"
    src="orders.js"
></script>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  
</body>

</html>
