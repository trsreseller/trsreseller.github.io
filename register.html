<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRS Reseller Registration</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f4f7fc;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.register-box{
width:100%;
max-width:450px;
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.08);
padding:0;
}

.register-header{
background:linear-gradient(
135deg,
#2563EB,
#1D4ED8
);
padding:35px 25px;
text-align:center;
color:white;
}

.register-header h1{
margin:0;
font-size:28px;
font-weight:700;
}

.register-header p{
margin-top:8px;
font-size:14px;
opacity:.9;
}

.register-body{
padding:25px;
}

.register-body input{
width:100%;
height:55px;
padding:0 15px;
border:1px solid #e5e7eb;
border-radius:14px;
font-size:15px;
margin-bottom:14px;
outline:none;
box-sizing:border-box;
}

.register-body input:focus{
border-color:#2563EB;
box-shadow:0 0 0 4px rgba(37,99,235,.1);
}

.agree-box{
display:flex;
align-items:flex-start;
gap:10px;
font-size:14px;
margin:15px 0 20px;
color:#444;
}

.agree-box input{
width:auto;
height:auto;
margin:0;
}

.register-btn{
width:100%;
height:55px;
background:#2563EB;
color:white;
border:none;
border-radius:14px;
font-size:17px;
font-weight:700;
cursor:pointer;
}

.register-btn:hover{
opacity:.95;
}

.bottom-text{
text-align:center;
margin-top:20px;
font-size:15px;
}

.bottom-text a{
color:#2563EB;
font-weight:700;
text-decoration:none;
}

</style>

</head>

<body>

<div class="register-box">

<div class="register-header">

<h1>TRS Reseller</h1>

<p>Create your reseller account</p>

</div>

<div class="register-body">

<input type="text" id="fullName" placeholder="Full Name">

<input type="text" id="shopName" placeholder="Your Shop Name">

<input type="url" id="facebookPage" placeholder="Facebook Page Link">

<input type="url" id="website" placeholder="Website (Optional)">

<input type="text" id="address" placeholder="Address">

<input type="tel" id="phone" placeholder="Phone Number">

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<div class="agree-box">

<input type="checkbox" id="agree">

<span>
I agree to the TRS Reseller Terms & Conditions
</span>

</div>

<button
id="registerBtn"
class="register-btn">

Create Reseller Account

</button>

<div class="bottom-text">

Already have a reseller account?

<a href="reseller-login.html">

Login

</a>

</div>

</div>

</div>


<!-- =========================================
     TRS PREMIUM GLOBAL POPUP
========================================= -->

<script src="popup.js"></script>

<!-- =========================================
     RESELLER REGISTRATION
========================================= -->

<script type="module" src="register.js"></script>

</body>
</html>
