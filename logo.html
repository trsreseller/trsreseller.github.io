<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>TRS Reseller — Logo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e8edf5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 40px;
    font-family: 'Poppins', sans-serif;
  }

  .card {
    background: linear-gradient(135deg, #0A2A6B 0%, #1848C4 55%, #2564E8 100%);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(10, 42, 107, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Primary horizontal lockup */
  .card--primary {
    width: 760px;
    height: 320px;
  }

  /* Square icon-only version */
  .card--square {
    width: 260px;
    height: 260px;
    border-radius: 56px;
  }

  .label {
    color: #4a5b7a;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: -20px;
  }

  .row {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }

  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
</style>
</head>
<body>

  <div class="col">
    <div class="label">Primary Logo</div>
    <div class="card card--primary">
      <svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mark-shine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#bcd4ff"/>
          </linearGradient>
        </defs>

        <!-- ICON MARK: package box with a forward arrow breaking out of it,
             symbolizing goods flowing from supplier -> reseller -> customer -->
        <g transform="translate(10,10)">
          <!-- box outline -->
          <rect x="20" y="60" width="140" height="140" rx="20"
                fill="none" stroke="url(#mark-shine)" stroke-width="12" stroke-linejoin="round"/>
          <!-- origin dot (supplier) -->
          <circle cx="60" cy="140" r="10" fill="#ffffff"/>
          <!-- flow line -->
          <path d="M60,140 L162,38" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
          <!-- arrowhead (customer) -->
          <path d="M132,30 L172,20 L162,60 Z" fill="#ffffff"/>
        </g>

        <!-- WORDMARK -->
        <g transform="translate(210,0)">
          <text x="0" y="118" font-family="Poppins, sans-serif" font-weight="800"
                font-size="86" fill="#ffffff" letter-spacing="2">TRS</text>
          <text x="4" y="166" font-family="Poppins, sans-serif" font-weight="600"
                font-size="34" fill="#bcd4ff" letter-spacing="10">RESELLER</text>
        </g>
      </svg>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div class="label">Icon Mark</div>
      <div class="card card--square">
        <svg width="150" height="150" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="60" width="140" height="140" rx="20"
                fill="none" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/>
          <circle cx="60" cy="140" r="10" fill="#ffffff"/>
          <path d="M60,140 L162,38" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
          <path d="M132,30 L172,20 L162,60 Z" fill="#ffffff"/>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
