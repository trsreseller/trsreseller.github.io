<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="my-orders.css"
    >

</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="dashboard-header">

        <div class="my-orders-header">

            <div>

                <h2>
                    My Orders
                </h2>

                <p>
                    আপনার সকল অর্ডার
                </p>

            </div>


            <a href="resellers.html">

                <button
                    type="button"
                    class="back-btn"
                >
                    Back
                </button>

            </a>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="my-orders-page">


        <!-- =====================================
             TOOLBAR
        ====================================== -->

        <div class="orders-toolbar">

            <div class="orders-title">

                <h3>
                    Order History
                </h3>

                <span id="orderCount">
                    0 Orders
                </span>

            </div>


            <select id="statusFilter">

                <option value="All">
                    All Orders
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Confirmed">
                    Confirmed
                </option>

                <option value="Processing">
                    Processing
                </option>

                <option value="Shipped">
                    Shipped
                </option>

                <option value="Delivered">
                    Delivered
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

                <option value="Returned">
                    Returned
                </option>

            </select>

        </div>


        <!-- =====================================
             ORDER LIST
        ====================================== -->

        <section id="orderList">

        </section>


    </main>


    <!-- =========================================
         ORDER DETAILS POPUP
    ========================================== -->

    <div
        id="orderDetailsModal"
        class="order-details-modal"
    >

        <div class="order-details-modal-content">


            <!-- MODAL HEADER -->

            <div class="order-details-modal-header">

                <div>

                    <span>
                        Order Details
                    </span>

                    <h2 id="detailsModalOrderId">
                        Order
                    </h2>

                </div>


                <button
                    type="button"
                    id="closeOrderDetails"
                    class="close-order-details"
                    aria-label="Close"
                >

                    <i class="fas fa-xmark"></i>

                </button>

            </div>


            <!-- MODAL CONTENT -->

            <div id="orderDetailsContent">

                <div class="details-loading">
                    Loading...
                </div>

            </div>


        </div>

    </div>


    <!-- =========================================
         INVOICE RENDER AREA
    ========================================== -->

    <div
        id="invoiceArea"
        class="invoice-render-area"
    ></div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="my-orders.js"
    ></script>


</body>

</html>
