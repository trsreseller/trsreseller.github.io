<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details - TRS Reseller</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="main-header">

    <div class="header-left">

        <button
            class="header-menu-btn"
            id="headerMenuBtn"
            aria-label="Open Menu">

            <i class="fas fa-bars"></i>

        </button>

    </div>


    <a href="index.html" class="header-logo">

        <img
            id="websiteLogo"
            src=""
            alt="TRS Reseller"
            style="display:none;">

    </a>


    <div class="header-right">

    </div>

</header>


<!-- =========================
     SIDEBAR
========================= -->

<div
    class="sidebar-overlay"
    id="sidebarOverlay">
</div>


<aside
    class="sidebar"
    id="sidebar">

    <div class="sidebar-header">

        <h2>TRS Reseller</h2>

        <button
            class="sidebar-close"
            id="sidebarClose">

            &times;

        </button>

    </div>


    <div
        class="sidebar-content"
        id="sidebarContent">

    </div>

</aside>


<!-- =========================
     PRODUCT PAGE
========================= -->

<main class="product-page">


    <!-- PRODUCT IMAGE -->

    <section class="product-gallery">

        <div class="product-main-image">

            <img
                id="mainImage"
                src=""
                alt="Product Image">

            <button
                class="image-prev"
                id="imagePrev"
                type="button">

                <i class="fas fa-chevron-left"></i>

            </button>


            <button
                class="image-next"
                id="imageNext"
                type="button">

                <i class="fas fa-chevron-right"></i>

            </button>

        </div>


        <div
            id="thumbnailContainer"
            class="product-thumbnails">

        </div>

    </section>


    <!-- PRODUCT INFORMATION -->

    <section class="product-info">


        <h1 id="productName">
            Loading...
        </h1>


        <!-- SKU -->

        <div class="product-sku">

            SKU:
            <span id="productSKU">
                —
            </span>

        </div>


        <!-- RATING / PRODUCT META -->

        <div class="product-meta">

            <span>
                <i class="fas fa-box"></i>
                Reseller Product
            </span>

        </div>


        <!-- PRICE -->

        <div class="product-price-section">

            <span class="product-price-label">
                Price
            </span>

            <strong
                id="productPrice"
                class="product-price">

                ৳ 0

            </strong>

        </div>


        <!-- =========================
             VARIANTS
        ========================= -->

        <div
            id="variantContainer"
            class="variant-container">

        </div>


        <!-- SELLING PRICE -->

        <div class="selling-price-section">

            <label for="sellingPrice">

                Your Selling Price

            </label>

            <div class="selling-input-wrapper">

                <span>৳</span>

                <input
                    type="number"
                    id="sellingPrice"
                    min="0"
                    step="1"
                    placeholder="Enter selling price per piece">

            </div>

        </div>


        <!-- PROFIT -->

        <div class="profit-box">

            <span>
                Your Profit
            </span>

            <strong id="profitText">
                ৳ 0
            </strong>

        </div>


        <!-- QUANTITY -->

        <div class="quantity-section">

            <span class="quantity-label">
                Quantity
            </span>

            <div class="quantity-control">

                <button
                    type="button"
                    id="minusBtn">

                    <i class="fas fa-minus"></i>

                </button>


                <input
                    type="number"
                    id="qty"
                    value="1"
                    min="1"
                    inputmode="numeric">


                <button
                    type="button"
                    id="plusBtn">

                    <i class="fas fa-plus"></i>

                </button>

            </div>

        </div>


        <!-- TOTAL PRICE -->

        <div class="product-total-box">

            <span>
                Total Price
            </span>

            <strong id="totalPrice">
                ৳ 0
            </strong>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="product-actions">

            <button
                id="addCartBtn"
                class="product-cart-btn"
                type="button">

                <i class="fas fa-cart-plus"></i>

                Add To Cart

            </button>


            <button
                id="orderBtn"
                class="product-order-btn"
                type="button">

                <i class="fas fa-bag-shopping"></i>

                Order Now

            </button>

        </div>


        <!-- DESCRIPTION -->

        <div class="product-description-section">

            <h2>
                Product Details
            </h2>

            <div
                id="productDescription"
                class="product-description">

                Loading product description...

            </div>

        </div>


    </section>

</main>


<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<nav class="bottom-nav">


    <button
        class="nav-item"
        onclick="window.location.href='index.html'">

        <i class="fas fa-house"></i>

        <span>
            Home
        </span>

    </button>


    <button
        class="nav-item"
        onclick="window.location.href='category.html'">

        <i class="fas fa-layer-group"></i>

        <span>
            Category
        </span>

    </button>


    <button
        class="nav-item cart-header-btn"
        onclick="window.location.href='cart.html'">

        <i class="fas fa-cart-shopping"></i>

        <span>
            Cart
        </span>

        <span
            id="cartCountBadge"
            style="display:none;">

        </span>

    </button>


    <button
        class="nav-item"
        id="productAccountBtn">

        <i class="fas fa-user"></i>

        <span>
            Account
        </span>

    </button>


</nav>


<script type="module" src="product.js"></script>

</body>

</html>
