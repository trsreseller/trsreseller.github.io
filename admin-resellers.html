<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRS Admin - Resellers</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div id="overlay" class="sidebar-overlay"></div>

<div class="sidebar">

<h2>TRS Admin</h2>

<ul>

<li onclick="location.href='admin.html'">
<i class="fas fa-house"></i>
<span>Dashboard</span>
</li>

<li onclick="location.href='products.html'">
<i class="fas fa-box"></i>
<span>Products</span>
</li>

<li onclick="location.href='categories.html'">
<i class="fas fa-layer-group"></i>
<span>Categories</span>
</li>

<li onclick="location.href='banners.html'">
<i class="fas fa-images"></i>
<span>Banners</span>
</li>

<li onclick="location.href='orders.html'">
<i class="fas fa-cart-shopping"></i>
<span>Orders</span>
</li>

<li class="active">
<i class="fas fa-users"></i>
<span>Resellers</span>
</li>

<li onclick="location.href='settings.html'">
<i class="fas fa-gear"></i>
<span>Settings</span>
</li>

<li id="logoutBtn">
<i class="fas fa-right-from-bracket"></i>
<span>Logout</span>
</li>

</ul>

</div>


<header class="admin-header">

<button id="menuBtn">
<i class="fas fa-bars"></i>
</button>

<div class="reseller-header-content">

<h2>
<i class="fas fa-users"></i>
Reseller Management
</h2>

</div>

</header>


<div class="admin-container reseller-page">


<div class="reseller-search-box">

<i class="fas fa-search"></i>

<input
type="text"
id="resellerSearch"
placeholder="Search reseller by name, phone, email or shop name..."
>

</div>


<div class="reseller-filters">

<button
class="reseller-filter active"
data-status="All">
All
</button>

<button
class="reseller-filter"
data-status="Pending">
Pending
</button>

<button
class="reseller-filter"
data-status="Approved">
Approved
</button>

<button
class="reseller-filter"
data-status="Rejected">
Rejected
</button>

<button
class="reseller-filter"
data-status="Banned">
Banned
</button>

</div>


<div class="reseller-result-header">

<h3>
All Resellers
</h3>

<span id="resellerCount">
0 Resellers
</span>

</div>


<div id="resellerList"
class="reseller-grid">

</div>

</div>


<div
id="resellerModal"
class="reseller-modal">

<div class="reseller-modal-box">

<button
id="closeResellerModal"
class="close-reseller-modal">

<i class="fas fa-xmark"></i>

</button>

<div id="resellerModalContent"></div>

</div>

</div>


<script type="module"
src="admin-resellers.js"></script>


<script>

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.querySelector(".sidebar");

const overlay =
document.getElementById("overlay");


menuBtn.onclick = function(){

sidebar.classList.toggle("show");

overlay.classList.toggle("show");

};


overlay.onclick = function(){

sidebar.classList.remove("show");

overlay.classList.remove("show");

};

</script>

</body>

</html>
