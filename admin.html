<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRS Reseller Admin</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>
  
  <div id="overlay" class="sidebar-overlay"></div>
  
  <div class="sidebar">

<h2>TRS Admin</h2>

<ul>

<li class="active" onclick="location.href='admin.html'">🏠 Dashboard</li>

<li onclick="location.href='products.html'">📦 Products</li>

<li onclick="location.href='categories.html'">📂 Categories</li>

<li onclick="location.href='banners.html'">🎞️ Banners</li>

<li onclick="location.href='orders.html'">🛒 Orders</li>

<li onclick="location.href='admin-resellers.html'">👥 Resellers</li>

<li onclick="location.href='settings.html'">⚙️ Settings</li>

</ul>

</div>

<header class="admin-header">
  
  <button id="menuBtn">☰</button>

<div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
<h2>TRS Reseller Admin Panel</h2>

<button id="logoutBtn"
style="background:#dc3545;color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;">
Logout
</button>

</div>

</header>

<div class="admin-container">
  
  <section id="dashboardPage">

<h2>Dashboard</h2>

<div class="dashboard-cards">

<div class="card">
<h2 id="totalProducts">0</h2>
<p>Total Products</p>
</div>

<div class="card">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>

<div class="card">
<h2 id="totalResellers">0</h2>
<p>Total Resellers</p>
</div>

<div class="card">
<h2 id="totalRevenue">৳0</h2>
<p>Total Revenue</p>
</div>

</div>

</section>

<section id="resellersPage" style="display:none;">

<hr style="margin:25px 0;">

<h3>Pending Reseller Requests</h3>

<div id="resellerList"></div>

</section>

</div>

<script type="module" src="admin.js"></script>

<script>
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.querySelector(".sidebar");
const overlay = document.getElementById("overlay");

menuBtn.onclick = function () {
    sidebar.classList.toggle("show");
    overlay.classList.toggle("show");
};

overlay.onclick = function () {
    sidebar.classList.remove("show");
    overlay.classList.remove("show");
};
</script>

</body>
</html>
