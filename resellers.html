<!DOCTYPE html>
<html lang="en">

<head>
  
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRS Reseller Dashboard</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<header class="dashboard-header">

<div>

<h2>TRS Reseller</h2>

<p>Reseller Dashboard</p>

</div>

<div class="header-actions">

<a href="index.html">

<button class="website-btn">

<i class="fas fa-globe"></i>

Website

</button>

</a>

<button id="logoutBtn" class="logout-btn">

<i class="fas fa-right-from-bracket"></i>

Logout

</button>

</div>

</header>

<div class="dashboard-container">

<!-- Profile -->

<div class="profile-card">

<img id="profileImage"
src="https://via.placeholder.com/100"
alt="Profile">

<h2 id="resellerName">
Loading...
</h2>

<p id="shopName">
Shop Name
</p>

<p id="resellerEmail">
Email
</p>

<p id="resellerPhone">
Phone
</p>

</div>

<div class="overview-card">

<h3>Earnings Overview</h3>

<div class="overview-grid">

<div>

<p>Today's Profit</p>

<h2 id="todayProfit">
৳0
</h2>

</div>

<div>

<p>This Month</p>

<h2 id="monthProfit">
৳0
</h2>

</div>

</div>

</div>

<!-- Statistics -->

<div class="quick-actions">

<h3>Quick Actions</h3>

<div class="action-grid">

<button onclick="location.href='cart.html'">
<i class="fas fa-cart-shopping"></i>
<span>My Cart</span>
</button>

<button onclick="location.href='checkout.html'">
<i class="fas fa-credit-card"></i>
<span>Checkout</span>
</button>

<button onclick="location.href='index.html'">
<i class="fas fa-store"></i>
<span>Products</span>
</button>

<button id="withdrawBtn">

<i class="fas fa-money-bill-wave"></i>

<span>Withdraw</span>

</button>

</div>

</div>

<div class="stats-grid">

<div class="stat-card">

<h3>Total Orders</h3>

<h2 id="totalOrders">
0
</h2>

</div>

<div class="stat-card">

<h3>Total Sales</h3>

<h2 id="totalSales">
৳0
</h2>

</div>

<div class="stat-card">

<h3>Total Profit</h3>

<h2 id="totalProfit">
৳0
</h2>

</div>

<div class="stat-card">

<h3>Wallet</h3>

<h2 id="wallet">
৳0
</h2>

</div>

</div>

<!-- Menu -->

<div class="dashboard-menu">

<button id="myOrdersBtn">

<i class="fas fa-box"></i>

<span>My Orders</span>

</button>

<button id="settingsBtn">

<i class="fas fa-gear"></i>

<span>Settings</span>

</button>

<button id="walletBtn">

<i class="fas fa-wallet"></i>

<span>My Wallet</span>

</button>

<button id="reportsBtn">

<i class="fas fa-chart-line"></i>

<span>Analytics</span>

</button>

</div>

<div class="recent-orders">

<h3>Recent Orders</h3>

<div class="recent-card">

<p>No Orders Yet</p>

</div>

</div>

<script type="module" src="resellers.js"></script>

</body>

</html>
