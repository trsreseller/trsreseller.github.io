<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="checkout.css">

<style>

/* =========================
   CHECKOUT
========================= */

.checkout-container{
    max-width:600px;
    margin:25px auto;
    padding:20px;
}

.checkout-field{
    margin-bottom:18px;
}

.checkout-field label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
    color:#333;
}

.checkout-field input,
.checkout-field textarea,
.checkout-field select{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    background:#fff;
}

.checkout-field textarea{
    min-height:100px;
    resize:vertical;
}

.checkout-field input:focus,
.checkout-field textarea:focus,
.checkout-field select:focus{
    border-color:#2563eb;
}


/* =========================
   DELIVERY CHARGE
========================= */

.delivery-charge-box{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px;
    margin:5px 0 20px;

    background:#f7f9fd;

    border-radius:12px;

    border:1px solid #e8edf5;
}

.delivery-charge-box span:first-child{
    font-weight:600;
}

#deliveryCharge{
    color:#2563eb;
    font-weight:700;
}


/* =========================
   PAYMENT METHOD
========================= */

.payment-section{
    margin-top:10px;
}

.payment-section h3{
    margin-bottom:12px;
    font-size:19px;
    font-weight:700;
}


/* Payment option */

.checkout-payment-option{

    display:flex;

    align-items:center;

    gap:12px;

    padding:17px;

    margin-bottom:10px;

    background:#f7f9fd;

    border:1px solid #e5eaf2;

    border-radius:14px;

    cursor:pointer;

    transition:.2s;
}

.checkout-payment-option:hover{

    border-color:#2563eb;

    background:#f3f7ff;

}


/* Radio */

.checkout-payment-option input{

    width:20px;
    height:20px;

    margin:0;

    accent-color:#2563eb;

    cursor:pointer;
}


/* Text */

.checkout-payment-option span{

    font-size:16px;

    font-weight:600;

    color:#222;

}


/* Selected */

.checkout-payment-option:has(
    input:checked
){

    border-color:#2563eb;

    background:#eef4ff;

}


/* =========================
   TOTAL
========================= */

.total-box{

    margin-top:20px;

    padding:18px;

    background:#eef4ff;

    border-radius:14px;
}

.total-row{

    display:flex;

    justify-content:space-between;

    margin:7px 0;

    font-size:15px;
}

.total-row.final{

    margin-top:12px;

    padding-top:12px;

    border-top:1px solid #d7e1f2;

    font-size:20px;

    font-weight:700;
}

#checkoutTotal{

    color:#2563eb;

}


/* =========================
   PLACE ORDER
========================= */

#placeOrderBtn{

    width:100%;

    height:52px;

    margin-top:20px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:#fff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

#placeOrderBtn:hover{

    background:#1d4ed8;

}

#placeOrderBtn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================
   LOADING / MESSAGE
========================= */

.no-data-message{

    padding:12px;

    background:#fff7ed;

    color:#c2410c;

    border-radius:10px;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .checkout-container{

        margin:15px auto;

        padding:15px;

    }

    .checkout-payment-option{

        padding:16px;

    }

    .checkout-payment-option span{

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="dashboard-header">

    <h2>
        Checkout
    </h2>

    <a href="cart.html">

        <button>
            ← Back
        </button>

    </a>

</header>



<!-- =========================
     CHECKOUT CONTAINER
========================= -->

<div class="checkout-container">


    <!-- =========================
         CUSTOMER NAME
    ========================= -->

    <div class="checkout-field">

        <label for="customerName">
            Customer Name
        </label>

        <input
            type="text"
            id="customerName"
            placeholder="Customer Name"
        >

    </div>



    <!-- =========================
         CUSTOMER PHONE
    ========================= -->

    <div class="checkout-field">

        <label for="customerPhone">
            Customer Phone
        </label>

        <input
            type="tel"
            id="customerPhone"
            placeholder="Customer Phone"
        >

    </div>



    <!-- =========================
         CUSTOMER ADDRESS
    ========================= -->

    <div class="checkout-field">

        <label for="customerAddress">
            Customer Address
        </label>

        <textarea
            id="customerAddress"
            placeholder="Customer Address"
        ></textarea>

    </div>



    <!-- =========================
         DELIVERY AREA
    ========================= -->

    <div class="checkout-field">

        <label for="deliveryArea">
            Delivery Area
        </label>

        <select id="deliveryArea">

            <option value="">
                Select Delivery Area
            </option>

        </select>

    </div>



    <!-- =========================
         DELIVERY CHARGE
    ========================= -->

    <div
        class="delivery-charge-box"
        id="deliveryChargeBox"
        style="display:none;"
    >

        <span>
            Delivery Charge
        </span>

        <span id="deliveryCharge">
            ৳0
        </span>

    </div>



    <!-- =========================
         PAYMENT TYPE
    ========================= -->

    <div class="payment-section">

        <h3>
            Payment Method
        </h3>


        <div id="paymentMethodsContainer">

    <label class="checkout-payment-option">

        <input
            type="radio"
            name="checkoutPaymentType"
            value="cod"
        >

        <span>
            Cash on Delivery
        </span>

    </label>


    <label class="checkout-payment-option">

        <input
            type="radio"
            name="checkoutPaymentType"
            value="delivery"
        >

        <span>
            Pay Delivery Charge in Advance
        </span>

    </label>


    <label class="checkout-payment-option">

        <input
            type="radio"
            name="checkoutPaymentType"
            value="full"
        >

        <span>
            Full Payment in Advance
        </span>

    </label>

</div>

    </div>



    <!-- =========================
         TOTAL
    ========================= -->

    <div class="total-box">


        <div class="total-row">

            <span>
                Product Total
            </span>

            <strong id="productTotal">
                ৳0
            </strong>

        </div>


        <div class="total-row">

            <span>
                Delivery Charge
            </span>

            <strong id="deliveryTotal">
                ৳0
            </strong>

        </div>


        <div class="total-row final">

            <span>
                Total
            </span>

            <strong id="checkoutTotal">
                ৳0
            </strong>

        </div>


    </div>



    <!-- =========================
         PLACE ORDER
    ========================= -->

    <button
        id="placeOrderBtn"
        disabled
    >

        Place Order

    </button>


</div>



<!-- =========================
     CHECKOUT JS
========================= -->

<script
    type="module"
    src="checkout.js"
></script>


</body>

</html>
