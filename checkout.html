<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Checkout - TRS Reseller</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="checkout.css">

<style>

/* =====================================================
   CHECKOUT CONTAINER
===================================================== */

.checkout-container{
    max-width:680px;
    margin:25px auto;
    padding:20px;
}


/* =====================================================
   ORDER SUMMARY
===================================================== */

.checkout-order-summary{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    margin-bottom:24px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.checkout-summary-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:18px 20px;
    border-bottom:1px solid #edf0f4;
    background:#fafbfc;
}

.checkout-summary-header h3{
    margin:0;
    font-size:19px;
    font-weight:800;
    color:#172033;
}

.checkout-summary-header p{
    margin:5px 0 0;
    font-size:12px;
    color:#7b8491;
}

.checkout-product-count{
    flex-shrink:0;
    padding:7px 12px;
    border-radius:20px;
    background:#eef4ff;
    color:#2563eb;
    font-size:12px;
    font-weight:800;
}


/* =====================================================
   PRODUCTS LIST
===================================================== */

.checkout-products-list{
    padding:14px;
    max-height:500px;
    overflow-y:auto;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.checkout-product-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;

    padding:16px;

    margin-bottom:12px;

    background:#fff;

    border:1px solid #e4e8ef;

    border-radius:15px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.035);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}

.checkout-product-item:last-child{
    margin-bottom:0;
}

.checkout-product-item:hover{
    border-color:#cbd8f5;

    box-shadow:
        0 6px 18px rgba(37,99,235,.08);

    transform:translateY(-1px);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.checkout-product-image{
    width:105px;
    height:105px;

    flex:0 0 105px;

    border-radius:12px;

    overflow:hidden;

    background:#f5f7fa;

    border:1px solid #e7ebf1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.checkout-product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.checkout-product-image-placeholder{
    font-size:11px;
    color:#9ca3af;
    text-align:center;
}


/* =====================================================
   PRODUCT INFORMATION
===================================================== */

.checkout-product-info{
    min-width:0;
    flex:1;
}

.checkout-product-name{
    font-size:16px;
    font-weight:800;
    color:#182033;
    line-height:1.35;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}


/* =====================================================
   SKU
===================================================== */

.checkout-product-sku{
    margin-top:5px;

    font-size:11px;
    font-weight:700;

    color:#6b7280;

    line-height:1.3;
}

.checkout-product-sku span{
    color:#374151;
    font-weight:800;
}


/* =====================================================
   VARIANT DETAILS
===================================================== */

.checkout-product-variants{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;

    margin-top:8px;
}

.checkout-product-variant{
    display:inline-flex;
    align-items:center;

    padding:5px 8px;

    border-radius:7px;

    background:#f4f7fb;

    border:1px solid #e7ebf1;

    color:#374151;

    font-size:11px;
    font-weight:700;

    line-height:1.2;
}

.checkout-product-variant-label{
    color:#6b7280;
    margin-right:4px;
    font-weight:600;
}


/* =====================================================
   PRODUCT META
===================================================== */

.checkout-product-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;

    margin-top:9px;
}

.checkout-product-meta-item{
    font-size:12px;
    color:#6b7280;
}

.checkout-product-meta-item strong{
    color:#374151;
    font-weight:750;
}


/* =====================================================
   SUBTOTAL
===================================================== */

.checkout-product-subtotal{
    flex:0 0 auto;

    min-width:90px;

    text-align:right;

    padding-left:8px;
}

.checkout-product-subtotal-label{
    display:block;

    font-size:10px;

    color:#8a929e;

    margin-bottom:3px;
}

.checkout-product-subtotal strong{
    display:block;

    font-size:17px;

    font-weight:850;

    color:#2563eb;

    white-space:nowrap;
}


/* =====================================================
   PRODUCTS TOTAL
===================================================== */

.checkout-summary-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:16px 20px;

    background:#f8faff;

    border-top:1px solid #e8edf5;
}

.checkout-summary-bottom span{
    font-size:14px;
    font-weight:700;
    color:#374151;
}

.checkout-summary-bottom strong{
    font-size:18px;
    font-weight:850;
    color:#2563eb;
}

.checkout-products-empty{
    padding:35px 15px;
    text-align:center;
    color:#777;
    font-size:14px;
}


/* =====================================================
   FORM FIELDS
===================================================== */

.checkout-field{
    margin-bottom:18px;
}

.checkout-field label{
    display:block;
    margin-bottom:7px;

    font-size:14px;
    font-weight:700;

    color:#333;
}

.checkout-field input,
.checkout-field textarea,
.checkout-field select{
    width:100%;
    box-sizing:border-box;

    padding:14px;

    border:1px solid #ddd;
    border-radius:12px;

    outline:none;

    font-size:15px;

    background:#fff;

    transition:.2s;
}

.checkout-field textarea{
    min-height:100px;
    resize:vertical;
}

.checkout-field input:focus,
.checkout-field textarea:focus,
.checkout-field select:focus{
    border-color:#2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.08);
}


/* =====================================================
   DISTRICT
===================================================== */

.district-selector{
    position:relative;
    width:100%;
}

.district-selected{
    width:100%;
    min-height:49px;

    box-sizing:border-box;

    padding:14px;

    border:1px solid #ddd;
    border-radius:12px;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    cursor:pointer;
    user-select:none;

    transition:.2s;
}

.district-selected:hover{
    border-color:#2563eb;
}

.district-selector.open .district-selected{
    border-color:#2563eb;
    border-radius:12px 12px 0 0;
}

.district-placeholder{
    color:#8b929d;
}

#districtSelectedText{
    font-size:15px;
}

.district-arrow{
    width:9px;
    height:9px;

    border-right:2px solid #6b7280;
    border-bottom:2px solid #6b7280;

    transform:rotate(45deg);

    transition:.2s;

    margin-right:3px;
}

.district-selector.open .district-arrow{
    transform:rotate(225deg);
    margin-top:6px;
}

.district-dropdown{
    position:absolute;

    left:0;
    right:0;
    top:100%;

    z-index:1000;

    display:none;

    background:#fff;

    border:1px solid #2563eb;
    border-top:none;

    border-radius:0 0 12px 12px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.12);

    overflow:hidden;
}

.district-selector.open .district-dropdown{
    display:block;
}

.district-search-box{
    padding:10px;

    background:#f8fafc;

    border-bottom:1px solid #e5e7eb;
}

.district-search{
    width:100% !important;
    box-sizing:border-box;

    padding:11px 12px !important;

    border:1px solid #dfe3e8 !important;
    border-radius:9px !important;

    font-size:14px !important;

    background:#fff !important;
}

.district-search:focus{
    border-color:#2563eb !important;
}

.district-list{
    max-height:260px;
    overflow-y:auto;
}

.district-option{
    padding:12px 14px;

    font-size:14px;

    color:#333;

    cursor:pointer;

    transition:.15s;
}

.district-option:hover{
    background:#eef4ff;
    color:#2563eb;
}

.district-option.selected{
    background:#eef4ff;
    color:#2563eb;
    font-weight:700;
}

.district-no-result{
    padding:20px;

    text-align:center;

    color:#888;

    font-size:13px;
}


/* =====================================================
   DELIVERY CHARGE
===================================================== */

.delivery-charge-box{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px;

    margin:5px 0 20px;

    background:#f7f9fd;

    border-radius:12px;

    border:1px solid #e8edf5;
}

.delivery-charge-box span:first-child{
    font-weight:650;
}

#deliveryCharge{
    color:#2563eb;
    font-weight:800;
}


/* =====================================================
   PAYMENT
===================================================== */

.payment-section{
    margin-top:10px;
}

.payment-section h3{
    margin-bottom:12px;

    font-size:19px;
    font-weight:800;
}

.checkout-payment-option{
    display:flex;
    align-items:center;

    gap:12px;

    padding:17px;

    margin-bottom:10px;

    background:#f7f9fd;

    border:1px solid #e5eaf2;

    border-radius:14px;

    cursor:pointer;

    transition:.2s;
}

.checkout-payment-option:hover{
    border-color:#2563eb;
    background:#f3f7ff;
}

.checkout-payment-option input{
    width:20px;
    height:20px;

    margin:0;

    accent-color:#2563eb;

    cursor:pointer;
}

.checkout-payment-option span{
    font-size:15px;
    font-weight:650;
    color:#222;
}

.checkout-payment-option:has(
    input:checked
){
    border-color:#2563eb;
    background:#eef4ff;
}


/* =====================================================
   TOTAL
===================================================== */

.total-box{
    margin-top:20px;

    padding:18px;

    background:#eef4ff;

    border-radius:14px;
}

.total-row{
    display:flex;
    justify-content:space-between;

    margin:7px 0;

    font-size:15px;
}

.total-row.final{
    margin-top:12px;

    padding-top:12px;

    border-top:1px solid #d7e1f2;

    font-size:20px;
    font-weight:800;
}

#checkoutTotal{
    color:#2563eb;
}


/* =====================================================
   PROFIT
===================================================== */

.profit-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:12px;

    padding:12px 0;

    border-top:1px dashed #d7e1f2;
}

.profit-row span{
    font-size:15px;
    font-weight:750;
}

#yourProfit{
    font-size:17px;
    font-weight:850;
    color:#16a34a;
}


/* =====================================================
   PLACE ORDER
===================================================== */

#placeOrderBtn{
    width:100%;
    height:52px;

    margin-top:20px;

    border:none;
    border-radius:12px;

    background:#2563eb;

    color:#fff;

    font-size:16px;
    font-weight:750;

    cursor:pointer;

    transition:.2s;
}

#placeOrderBtn:hover{
    background:#1d4ed8;
}

#placeOrderBtn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .checkout-container{
        margin:15px auto;
        padding:12px;
    }


    .checkout-order-summary{
        border-radius:15px;
        margin-bottom:20px;
    }


    .checkout-summary-header{
        padding:15px;
    }


    .checkout-summary-header h3{
        font-size:16px;
    }


    .checkout-summary-header p{
        font-size:10px;
    }


    .checkout-product-count{
        font-size:10px;
        padding:6px 9px;
    }


    .checkout-products-list{
        padding:10px;
        max-height:500px;
    }


    .checkout-product-item{
        gap:11px;
        padding:12px;
        border-radius:13px;
    }


    .checkout-product-image{
        width:78px;
        height:78px;
        flex-basis:78px;
        border-radius:10px;
    }


    .checkout-product-name{
        font-size:13px;
    }


    .checkout-product-sku{
        font-size:10px;
        margin-top:4px;
    }


    .checkout-product-variants{
        margin-top:6px;
        gap:4px;
    }


    .checkout-product-variant{
        font-size:10px;
        padding:4px 6px;
    }


    .checkout-product-meta{
        gap:8px;
        margin-top:7px;
    }


    .checkout-product-meta-item{
        font-size:10px;
    }


    .checkout-product-subtotal{
        min-width:65px;
        padding-left:3px;
    }


    .checkout-product-subtotal-label{
        font-size:9px;
    }


    .checkout-product-subtotal strong{
        font-size:14px;
    }


    .checkout-summary-bottom{
        padding:14px 15px;
    }


    .checkout-summary-bottom span{
        font-size:13px;
    }


    .checkout-summary-bottom strong{
        font-size:16px;
    }


    .checkout-payment-option{
        padding:16px;
    }


    .checkout-payment-option span{
        font-size:14px;
    }

}

</style>

</head>


<body>


<header class="dashboard-header">

    <h2>
        Checkout
    </h2>

    <a href="cart.html">

        <button>
            ← Back
        </button>

    </a>

</header>


<div class="checkout-container">


    <!-- =================================================
         ORDER SUMMARY
    ================================================== -->

    <div class="checkout-order-summary">

        <div class="checkout-summary-header">

            <div>

                <h3>
                    Your Products
                </h3>

                <p>
                    Review your products before placing the order
                </p>

            </div>

            <span
                id="checkoutProductCount"
                class="checkout-product-count"
            >
                0 Items
            </span>

        </div>


        <div
            id="checkoutProductsList"
            class="checkout-products-list"
        ></div>


        <div class="checkout-summary-bottom">

            <span>
                Products Total
            </span>

            <strong id="checkoutProductsSubtotal">
                ৳0
            </strong>

        </div>

    </div>


    <!-- =================================================
         CUSTOMER NAME
    ================================================== -->

    <div class="checkout-field">

        <label for="customerName">
            Customer Name
        </label>

        <input
            type="text"
            id="customerName"
            placeholder="Customer Name"
            autocomplete="name"
        >

    </div>


    <!-- =================================================
         CUSTOMER PHONE
    ================================================== -->

    <div class="checkout-field">

        <label for="customerPhone">
            Customer Phone
        </label>

        <input
            type="tel"
            id="customerPhone"
            placeholder="Customer Phone"
            autocomplete="tel"
        >

    </div>


    <!-- =================================================
         DISTRICT
    ================================================== -->

    <div class="checkout-field">

        <label for="customerDistrict">
            District
        </label>

        <div
            class="district-selector"
            id="districtSelector"
        >

            <div
                class="district-selected"
                id="districtSelected"
            >

                <span
                    id="districtSelectedText"
                    class="district-placeholder"
                >
                    Select District
                </span>

                <span class="district-arrow"></span>

            </div>


            <div
                class="district-dropdown"
                id="districtDropdown"
            >

                <div class="district-search-box">

                    <input
                        type="search"
                        id="districtSearch"
                        class="district-search"
                        placeholder="Search District..."
                        autocomplete="off"
                    >

                </div>


                <div
                    id="districtList"
                    class="district-list"
                ></div>

            </div>

        </div>


        <input
            type="hidden"
            id="customerDistrict"
            value=""
        >

    </div>


    <!-- =================================================
         CUSTOMER ADDRESS
    ================================================== -->

    <div class="checkout-field">

        <label for="customerAddress">
            Customer Address
        </label>

        <textarea
            id="customerAddress"
            placeholder="Customer Address"
        ></textarea>

    </div>


    <!-- =================================================
         DELIVERY AREA
    ================================================== -->

    <div class="checkout-field">

        <label for="deliveryArea">
            Delivery Area
        </label>

        <select id="deliveryArea">

            <option value="">
                Select Delivery Area
            </option>

        </select>

    </div>


    <!-- =================================================
         DELIVERY CHARGE
    ================================================== -->

    <div
        class="delivery-charge-box"
        id="deliveryChargeBox"
        style="display:none;"
    >

        <span>
            Delivery Charge
        </span>

        <span id="deliveryCharge">
            ৳0
        </span>

    </div>


    <!-- =================================================
         PAYMENT
    ================================================== -->

    <div class="payment-section">

        <h3>
            Payment Method
        </h3>


        <div id="paymentMethodsContainer">

            <label class="checkout-payment-option">

                <input
                    type="radio"
                    name="checkoutPaymentType"
                    value="COD"
                >

                <span>
                    Cash on Delivery
                </span>

            </label>


            <label class="checkout-payment-option">

                <input
                    type="radio"
                    name="checkoutPaymentType"
                    value="DELIVERY_ADVANCE"
                >

                <span>
                    Pay Delivery Charge in Advance
                </span>

            </label>


            <label class="checkout-payment-option">

                <input
                    type="radio"
                    name="checkoutPaymentType"
                    value="FULL_ADVANCE"
                >

                <span>
                    Full Payment in Advance
                </span>

            </label>

        </div>

    </div>


    <!-- =================================================
         TOTAL
    ================================================== -->

    <div class="total-box">

        <div class="total-row">

            <span>
                Product Total
            </span>

            <strong id="productTotal">
                ৳0
            </strong>

        </div>


        <div class="profit-row">

            <span>
                Your Profit
            </span>

            <strong id="yourProfit">
                ৳0
            </strong>

        </div>


        <div class="total-row">

            <span>
                Delivery Charge
            </span>

            <strong id="deliveryTotal">
                ৳0
            </strong>

        </div>


        <div class="total-row final">

            <span>
                Total
            </span>

            <strong id="checkoutTotal">
                ৳0
            </strong>

        </div>

    </div>


    <!-- =================================================
         PLACE ORDER
    ================================================== -->

    <button
        id="placeOrderBtn"
        disabled
    >
        Place Order
    </button>


</div>


<script
    type="module"
    src="checkout.js?v=20260912-product-card"
></script>


</body>

</html>
