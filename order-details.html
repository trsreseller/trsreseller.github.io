<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Details | TRS Reseller</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1e293b;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =========================
           HEADER
        ========================= */

        .details-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .details-header-inner {
            max-width: 1100px;
            margin: auto;
            padding: 15px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .header-title-area h1 {
            margin: 0;
            font-size: 21px;
            color: #111827;
        }

        .header-title-area p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #64748b;
        }

        .back-btn {
            border: 0;
            background: #f1f5f9;
            color: #334155;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #e2e8f0;
        }

        /* =========================
           MAIN
        ========================= */

        .details-container {
            max-width: 1100px;
            margin: auto;
            padding: 22px 15px 50px;
        }

        #orderDetails {
            display: grid;
            gap: 18px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading-box,
        .error-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
        }

        .loading-box {
            color: #64748b;
        }

        .error-box h3 {
            margin: 0 0 8px;
            color: #b91c1c;
        }

        .error-box p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        /* =========================
           ORDER TOP
        ========================= */

        .order-summary-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            box-shadow:
                0 4px 18px
                rgba(15, 23, 42, 0.05);
        }

        .order-summary-left h2 {
            margin: 0 0 7px;
            font-size: 20px;
            color: #111827;
        }

        .order-summary-left p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }

        .status-pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-confirmed {
            background: #f5f3ff;
            color: #6d28d9;
        }

        .status-processing {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status-shipped {
            background: #ecfeff;
            color: #0e7490;
        }

        .status-delivered {
            background: #ecfdf5;
            color: #047857;
        }

        .status-cancelled {
            background: #fef2f2;
            color: #b91c1c;
        }

        .status-returned {
            background: #fdf4ff;
            color: #a21caf;
        }

        /* =========================
           SECTION CARD
        ========================= */

        .details-section {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .section-header {
            padding: 15px 18px;
            background: #fafbfc;
            border-bottom: 1px solid #eef0f3;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .section-header h3 {
            margin: 0;
            font-size: 15px;
            color: #111827;
        }

        .section-body {
            padding: 18px;
        }

        /* =========================
           INFO GRID
        ========================= */

        .info-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 1px;

            background: #eef0f3;

            border: 1px solid #eef0f3;
            border-radius: 9px;
            overflow: hidden;
        }

        .info-item {
            background: #ffffff;
            padding: 13px 14px;
        }

        .info-item.full {
            grid-column: 1 / -1;
        }

        .info-item span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .info-item strong {
            display: block;
            color: #1e293b;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        /* =========================
           RESELLER
        ========================= */

        .reseller-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .reseller-logo {
            width: 62px;
            height: 62px;

            border-radius: 12px;

            background: #f1f5f9;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            flex-shrink: 0;
        }

        .reseller-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .reseller-logo-placeholder {
            font-size: 22px;
            color: #94a3b8;
        }

        .reseller-info h3 {
            margin: 0 0 4px;
            font-size: 17px;
            color: #111827;
        }

        .reseller-info p {
            margin: 0;
            color: #64748b;
            font-size: 12px;
        }

        /* =========================
           PRODUCT TABLE
        ========================= */

        .products-table {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .product-row {
            display: grid;

            grid-template-columns:
                minmax(0, 2fr)
                80px
                110px
                120px;

            align-items: center;

            border-bottom: 1px solid #eef0f3;
        }

        .product-row:last-child {
            border-bottom: 0;
        }

        .product-row > div {
            padding: 12px;
        }

        .product-header {
            background: #f8fafc;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
        }

        .product-name {
            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 0;
        }

        .product-image {
            width: 48px;
            height: 48px;

            border-radius: 8px;

            object-fit: cover;

            background: #f1f5f9;

            flex-shrink: 0;
        }

        .product-name-text {
            min-width: 0;
        }

        .product-name-text strong {
            display: block;
            font-size: 13px;
            color: #1e293b;
            line-height: 1.4;
        }

        .product-price,
        .product-qty,
        .product-total {
            font-size: 13px;
            color: #334155;
        }

        .product-total {
            font-weight: 700;
            color: #111827;
        }

        /* =========================
           FINANCIAL
        ========================= */

        .financial-box {
            max-width: 500px;
            margin-left: auto;
        }

        .financial-row {
            display: flex;
            justify-content: space-between;

            gap: 20px;

            padding: 10px 0;

            border-bottom: 1px solid #eef0f3;

            font-size: 13px;
        }

        .financial-row span {
            color: #64748b;
        }

        .financial-row strong {
            color: #1e293b;
        }

        .financial-row.grand-total {
            padding-top: 15px;
            margin-top: 5px;

            border-bottom: 0;

            font-size: 16px;
        }

        .financial-row.grand-total span,
        .financial-row.grand-total strong {
            color: #111827;
            font-weight: 700;
        }

        .financial-row.profit {
            border-top: 1px solid #e5e7eb;
            border-bottom: 0;
            margin-top: 4px;
            padding-top: 14px;
        }

        .financial-row.profit span,
        .financial-row.profit strong {
            color: #047857;
            font-weight: 700;
        }

        /* =========================
           PAYMENT
        ========================= */

        .payment-status {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 6px;

            background: #f1f5f9;
            color: #475569;

            font-size: 12px;
            font-weight: 600;
        }

        /* =========================
           ACTIONS
        ========================= */

        .details-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-btn {
            border: 0;
            border-radius: 8px;

            padding: 11px 16px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .back-action {
            background: #f1f5f9;
            color: #334155;
        }

        .invoice-action {
            background: #ecfdf5;
            color: #047857;
        }

        .cancel-action {
            background: #fef2f2;
            color: #b91c1c;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .details-header-inner {
                padding: 13px 14px;
            }

            .header-title-area h1 {
                font-size: 18px;
            }

            .details-container {
                padding:
                    15px 10px 35px;
            }

            .order-summary-card {
                padding: 15px;
                align-items: flex-start;
                flex-direction: column;
            }

            .section-body {
                padding: 14px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .info-item.full {
                grid-column: auto;
            }

            .product-row {
                grid-template-columns:
                    minmax(0, 1fr)
                    55px
                    90px;
            }

            .product-row .product-price {
                display: none;
            }

            .product-header .product-price {
                display: none;
            }

            .product-row > div {
                padding: 10px 8px;
            }

            .product-image {
                width: 42px;
                height: 42px;
            }

            .financial-box {
                max-width: 100%;
            }

            .details-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="details-header">

        <div class="details-header-inner">

            <div class="header-title-area">

                <h1>
                    অর্ডারের বিস্তারিত
                </h1>

                <p>
                    আপনার অর্ডারের সম্পূর্ণ তথ্য
                </p>

            </div>


            <button
                class="back-btn"
                type="button"
                onclick="history.back()"
            >
                ফিরে যান
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="details-container">

        <div id="orderDetails">

            <div class="loading-box">

                অর্ডারের তথ্য লোড হচ্ছে...

            </div>

        </div>

    </main>


    <!-- JS -->

    <script
        type="module"
        src="order-details.js"
    ></script>


</body>

</html>
